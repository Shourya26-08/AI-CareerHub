<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Dispatch</title><link rel="stylesheet" href="css/style.css"></head><body><header><strong>Disp<span>atch</span></strong></header><main class="auth"><h1>Welcome back</h1><form id="form"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Log in</button></form><p id="error"></p><a href="register.html">Create an account</a></main><script src="js/api.js"></script><script src="js/ui.js"></script><script>if(Api.isLoggedIn())location='index.html';form.onsubmit=async e=>{e.preventDefault();try{let d=await Api.login(username.value,password.value);Api.setToken(d.token);Api.setUsername(d.username);location='index.html'}catch(x){error.textContent=x.message}}</script></body></html>
