<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Dispatch</title><link rel="stylesheet" href="css/style.css"></head><body><header><strong>Disp<span>atch</span></strong></header><main class="auth"><h1>Join Dispatch</h1><form id="form"><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email"><input id="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><input id="bio" maxlength="280" placeholder="Short bio"><button>Create account</button></form><p id="error"></p><a href="login.html">Already have an account? Log in</a></main><script src="js/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{let d=await Api.register(username.value,email.value,password.value,bio.value);Api.setToken(d.token);Api.setUsername(d.username);location='index.html'}catch(x){error.textContent=x.message}}</script></body></html>
